title: Internet Bandwidth Sharing Application Detected
id: 93f1a6d4-2c58-4e91-9f47-7c2e6a8b3104
status: experimental
description: Detects known Windows applications used to monetize or share residential Internet bandwidth.
author: CyberSec Study
date: 2026/09/11
references:
    - https://www.microsoft.com/en-us/wdsi/threats/malware-encyclopedia-description?Name=PUA%3AWin32%2FTraffmonetizer
tags:
    - attack.command-and-control
    - attack.t1090
    - attack.resource-development
logsource:
    product: windows
    category: process_creation

detection:
    selection:
        Image|endswith:
            - '\Honeygain.exe'
            - '\earnapp.exe'
            - '\Pawns.app.exe'
            - '\Traffmonetizer.exe'
            - '\Peer2Profit.exe'
            - '\packetstream.exe'

    condition: selection

falsepositives:
    - Authorized bandwidth-sharing software
    - Security testing
    - Personal devices intentionally running bandwidth-sharing applications

level: medium
